<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">Deccan Birders</title>
  <desc id="d">A field-notebook page on a laterite background: the title Deccan Birders, the line "take your records with you, sightings on Swarm, readable by any app", and a pen drawing of an Indian Robin with its tail cocked, perched on a basalt rock in front of flat-topped Deccan hills.</desc>
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.24  0 0 0 0 0.12  0 0 0 0.09 0"/>
    </filter>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2b1509" flood-opacity="0.45"/>
    </filter>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#2b2a28" stroke-width="1.3" stroke-opacity="0.55"/>
    </pattern>
    <clipPath id="page"><path d="M46 40 L1236 30 L1240 368 L42 376 Z"/></clipPath>
  </defs>

  <!-- laterite ground -->
  <rect width="1280" height="400" fill="#9a4326"/>
  <rect width="1280" height="400" filter="url(#grain)"/>

  <!-- the notebook page -->
  <g filter="url(#shadow)">
    <path d="M46 40 L1236 30 L1240 368 L42 376 Z" fill="#f2e5c6"/>
  </g>
  <g clip-path="url(#page)">
    <rect width="1280" height="400" filter="url(#grain)"/>
    <g stroke="#9fb3c2" stroke-width="1" opacity="0.55">
      <line x1="0" y1="96" x2="1280" y2="94"/><line x1="0" y1="128" x2="1280" y2="126"/>
      <line x1="0" y1="160" x2="1280" y2="158"/><line x1="0" y1="192" x2="1280" y2="190"/>
      <line x1="0" y1="224" x2="1280" y2="222"/><line x1="0" y1="256" x2="1280" y2="254"/>
      <line x1="0" y1="288" x2="1280" y2="286"/><line x1="0" y1="320" x2="1280" y2="318"/>
      <line x1="0" y1="352" x2="1280" y2="350"/>
    </g>
    <line x1="112" y1="0" x2="110" y2="400" stroke="#c0503a" stroke-width="1.6" opacity="0.8"/>
    <g fill="#9a6a45" opacity="0.55">
      <circle cx="140" cy="62" r="5"/><circle cx="176" cy="62" r="5"/><circle cx="212" cy="61" r="5"/>
      <circle cx="248" cy="61" r="5"/><circle cx="284" cy="61" r="5"/><circle cx="320" cy="60" r="5"/>
    </g>

    <!-- Deccan traps: stepped, flat-topped hills in a monsoon-green wash -->
    <g filter="url(#rough)">
      <path d="M760 330 L790 300 L840 298 L856 280 L930 276 L946 262 L1040 258 L1058 274 L1120 276 L1134 292 L1200 296 L1240 318 L1240 368 L760 372 Z" fill="#3f6b48" opacity="0.22"/>
      <path d="M790 300 L840 298 L856 280 L930 276 L946 262 L1040 258 L1058 274 L1120 276 L1134 292 L1200 296" fill="none" stroke="#3f6b48" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      <path d="M868 296 L1110 292 M952 280 L1030 278" fill="none" stroke="#3f6b48" stroke-width="1.2" opacity="0.45" stroke-dasharray="14 7"/>
      <!-- tufts of monsoon grass -->
      <path d="M1150 344 l3 -13 M1157 344 l-3 -12 M1163 344 l5 -10" stroke="#3f6b48" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- washi tape -->
  <rect x="1090" y="18" width="130" height="30" fill="#d39b2a" opacity="0.72" transform="rotate(6 1155 33)"/>
  <rect x="26" y="330" width="110" height="28" fill="#d39b2a" opacity="0.6" transform="rotate(-9 81 344)"/>

  <!-- title block -->
  <text x="140" y="168" font-family="Georgia, 'Times New Roman', Times, serif" font-size="74" font-weight="700" fill="#2b2a28" letter-spacing="0.5">Deccan Birders</text>
  <path d="M142 186 C200 178 250 194 310 186 S420 178 480 187 S580 194 640 184" fill="none" stroke="#a34a28" stroke-width="3.2" stroke-linecap="round" filter="url(#rough)"/>
  <text x="142" y="232" font-family="Georgia, 'Times New Roman', Times, serif" font-size="25" font-style="italic" fill="#3a332c">take your records with you — sightings on Swarm,</text>
  <text x="142" y="264" font-family="Georgia, 'Times New Roman', Times, serif" font-size="25" font-style="italic" fill="#3a332c">readable by any app</text>

  <!-- the route, pencilled in -->
  <text x="142" y="322" font-family="'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="17" fill="#3f6b48">Field Journal <tspan fill="#a34a28">writes ⟶</tspan> <tspan font-weight="700" fill="#2b2a28">Swarm</tspan> <tspan fill="#a34a28">⟵ reads</tspan> Almanac · read-sightings · your app</text>

  <!-- field note beside the bird -->
  <g font-family="'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Sans MS', cursive" fill="#a34a28">
    <text x="772" y="104" font-size="17" transform="rotate(-4 772 104)">Indian Robin ×12</text>
    <text x="776" y="128" font-size="14" transform="rotate(-4 776 128)" fill="#6b4a2c">Kas plateau, by the pond</text>
    <path d="M858 138 C870 150 874 156 872 166" fill="none" stroke="#a34a28" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M866 161 L872 168 L877 160" fill="none" stroke="#a34a28" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Indian Robin (Copsychus fulicatus), male: tail cocked over the back -->
  <g filter="url(#rough)" stroke="#2b2a28" stroke-linecap="round" stroke-linejoin="round">
    <!-- basalt perch -->
    <path d="M882 292 C890 276 912 270 940 272 C962 266 990 268 1008 280 C1024 286 1034 298 1030 312 L878 314 C872 306 874 298 882 292 Z" fill="#4a4540" stroke-width="2.4"/>
    <path d="M900 294 L930 290 M960 286 L996 290 M915 304 L952 302" stroke="#f2e5c6" stroke-width="1.2" opacity="0.45" fill="none"/>
    <!-- legs -->
    <path d="M944 244 L940 275 M958 244 L962 274 M932 276 L948 276 M954 275 L972 275" fill="none" stroke-width="2.4"/>
    <!-- tail -->
    <path d="M996 200 C1010 170 1026 142 1040 118 C1046 108 1064 110 1064 124 C1056 156 1038 190 1020 222 Z" fill="#2b2a28" fill-opacity="0.6" stroke-width="2.8"/>
    <path d="M1008 204 L1048 124 M1014 212 L1056 126" fill="none" stroke="#f2e5c6" stroke-width="0.9" opacity="0.35"/>
    <!-- body -->
    <path d="M850 164 L872 157 C878 140 900 134 914 144 C934 154 960 168 984 184 C996 192 1004 200 1008 210 C1004 224 994 236 978 242 C952 252 918 248 900 232 C886 220 878 202 876 186 C874 176 866 170 850 166 Z" fill="url(#hatch)" stroke-width="2.8"/>
    <path d="M850 164 L872 157 C878 140 900 134 914 144 C934 154 960 168 984 184 C996 192 1004 200 1008 210 C1004 224 994 236 978 242 C952 252 918 248 900 232 C886 220 878 202 876 186 C874 176 866 170 850 166 Z" fill="#2b2a28" fill-opacity="0.5" stroke="none"/>
    <!-- bill line -->
    <path d="M852 165 L874 164" fill="none" stroke-width="1.6"/>
    <!-- folded wing -->
    <path d="M912 178 C940 170 972 182 1000 206 C976 216 944 214 922 202 C914 196 910 188 912 178 Z" fill="#2b2a28" fill-opacity="0.72" stroke-width="2.2"/>
    <path d="M934 204 L990 210 M944 196 L992 204" fill="none" stroke="#f2e5c6" stroke-width="0.9" opacity="0.4"/>
    <!-- white shoulder patch -->
    <path d="M920 180 C934 175 950 177 960 184 C948 190 932 190 920 186 Z" fill="#f7efdc" stroke-width="1.6"/>
    <!-- chestnut vent -->
    <path d="M982 226 C992 222 1002 216 1008 210 C1008 222 1000 234 986 240 C982 236 980 231 982 226 Z" fill="#a34a28" stroke-width="1.8"/>
    <!-- eye -->
    <circle cx="893" cy="153" r="4.2" fill="#f7efdc" stroke-width="1.4"/>
    <circle cx="893.6" cy="153" r="2.2" fill="#2b2a28" stroke="none"/>
  </g>

  <!-- specimen label -->
  <g transform="rotate(-2 1120 344)">
    <rect x="1014" y="326" width="206" height="34" fill="#f8f1de" stroke="#6b4a2c" stroke-width="1.2"/>
    <rect x="1018" y="330" width="198" height="26" fill="none" stroke="#6b4a2c" stroke-width="0.6"/>
    <text x="1117" y="347.5" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" fill="#2b2a28">org.deccanbirders.sighting</text>
  </g>
</svg>
